version: 2

project_name: jobtread-cli

changelog:
  disable: true

builds:
  - id: jobtread
    main: ./cmd/jobtread
    binary: jobtread
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: jobtread_darwin
    main: ./cmd/jobtread
    binary: jobtread
    env:
      - CGO_ENABLED=1
    targets:
      - darwin_amd64
      - darwin_arm64

archives:
  - ids:
      - jobtread
      - jobtread_darwin
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: checksums.txt
